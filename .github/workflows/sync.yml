name: Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 5"

jobs:
  export-cache:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    steps:
      - name: Restore Windows mirror cache
        uses: actions/cache/restore@v6
        with:
          path: .gitlab-mirror-cache.7z
          key: export-mirror-cache
          restore-keys: |
            gitlab-mirror-cache-Windows-
          fail-on-cache-miss: true

      - name: Upload mirror cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirror-cache
          path: .gitlab-mirror-cache.7z
          compression-level: 0
          retention-days: 1
          include-hidden-files: true

  sync:
    needs: export-cache
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout sync tools
        uses: actions/checkout@v7
        with:
          repository: NixaVulpi/GitLab2GitHubSyncTools
          path: tools

      - name: Load sync secrets
        shell: pwsh
        env:
          SYNC_SECRETS_JSON: ${{ secrets.SYNC_SECRETS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_SECRETS_JSON)) {
            throw "Secret SYNC_SECRETS is empty or missing."
          }

          try {
            $secrets = $env:SYNC_SECRETS_JSON | ConvertFrom-Json
          } catch {
            throw "Secret SYNC_SECRETS is not valid JSON."
          }

          function Add-GlobalEnv {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Name,

              [AllowNull()]
              $Value,

              [switch]$Optional,

              [switch]$NoMask
            )

            if ($null -eq $Value) {
              if ($Optional) { return }
              throw "SYNC_SECRETS is missing required value: $Name"
            }

            if ($Value -is [string]) {
              $text = $Value
            } else {
              $text = ConvertTo-Json -InputObject $Value -Depth 100 -Compress
            }

            if ([string]::IsNullOrWhiteSpace($text)) {
              if ($Optional) { return }
              throw "SYNC_SECRETS is missing required value: $Name"
            }

            if (-not $NoMask) {
              foreach ($line in ($text -split "(`r`n|`n|`r)")) {
                if (-not [string]::IsNullOrWhiteSpace($line)) {
                  Write-Output "::add-mask::$line"
                }
              }
            }

            $delimiter = "EOF_$([Guid]::NewGuid().ToString('N'))"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$Name<<$delimiter"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value $text
            Add-Content -LiteralPath $env:GITHUB_ENV -Value $delimiter
          }

          Add-GlobalEnv -Name "SYNC_ARCHIVE_PASSWORD" -Value $secrets.archive_password
          Add-GlobalEnv -Name "SYNC_VPN_PROFILES_JSON" -Value $secrets.vpn_profiles_json
          Add-GlobalEnv -Name "SYNC_GITLAB_HOST" -Value $secrets.gitlab_host
          Add-GlobalEnv -Name "SYNC_GITLAB_SSH_PRIVATE_KEY" -Value $secrets.gitlab_ssh_private_key
          Add-GlobalEnv -Name "SYNC_CONFIG_JSON" -Value $secrets.sync_config

          # Optional unispoke settings. These are not secrets, so they are not masked.
          $syncConfig = $secrets.sync_config
          if ($syncConfig -is [string]) {
            $syncConfig = $syncConfig | ConvertFrom-Json
          }
          foreach ($tokenName in @("github_token", "gitlab_token")) {
            $tokenValue = $syncConfig.$tokenName
            if (-not [string]::IsNullOrWhiteSpace($tokenValue)) {
              Write-Output "::add-mask::$tokenValue"
            }
          }

          Add-GlobalEnv -Name "SYNC_VPN_CA_PEM" -Value $secrets.vpn_ca_pem -Optional -NoMask
          Add-GlobalEnv -Name "SYNC_VPN_DOMAIN" -Value $secrets.vpn_domain -Optional -NoMask
          Add-GlobalEnv -Name "SYNC_VPN_SNI" -Value $secrets.vpn_sni -Optional -NoMask
          Add-GlobalEnv -Name "SYNC_VPN_MODE" -Value $secrets.vpn_mode -Optional -NoMask
          Add-GlobalEnv -Name "SYNC_VPN_MSS" -Value $secrets.vpn_mss -Optional -NoMask

      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail

          if ! sudo -n true 2>/dev/null; then
            echo "Passwordless sudo is required for TUN mode." >&2
            exit 1
          fi

          if ! command -v pwsh >/dev/null; then
            echo "pwsh is required." >&2
            exit 1
          fi

          if ! command -v 7z >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends p7zip-full || \
              sudo apt-get install -y --no-install-recommends 7zip
          fi
          if ! command -v 7z >/dev/null && command -v 7zz >/dev/null; then
            sudo ln -sf "$(command -v 7zz)" /usr/local/bin/7z
          fi
          if ! command -v 7z >/dev/null; then
            echo "7z is required." >&2
            exit 1
          fi

          if ! command -v python3 >/dev/null; then
            echo "python3 is required." >&2
            exit 1
          fi
          if ! command -v python >/dev/null; then
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python
          fi

          if [ ! -e /dev/net/tun ]; then
            sudo modprobe tun || true
            if [ ! -e /dev/net/tun ]; then
              sudo mkdir -p /dev/net
              sudo mknod /dev/net/tun c 10 200
              sudo chmod 666 /dev/net/tun
            fi
          fi

          if [ ! -e /dev/net/tun ]; then
            echo "/dev/net/tun is not available." >&2
            exit 1
          fi

          echo "Runner is ready for TUN mode."

      - name: Download unispoke
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "v0.2.1"

          $vpnDir = Join-Path $env:GITHUB_WORKSPACE "vpn"
          New-Item -ItemType Directory -Path $vpnDir -Force | Out-Null

          gh release download $version `
            --repo NixaVulpi/unispoke `
            --pattern "unispoke-linux-amd64" `
            --pattern "SHA256SUMS" `
            --dir $vpnDir `
            --clobber

          $sumsPath = Join-Path $vpnDir "SHA256SUMS"
          $binaryPath = Join-Path $vpnDir "unispoke-linux-amd64"
          if (-not (Test-Path -LiteralPath $binaryPath) -or -not (Test-Path -LiteralPath $sumsPath)) {
            throw "unispoke release download is incomplete."
          }

          $expected = (Get-Content -LiteralPath $sumsPath |
            Where-Object { $_ -match '\s+unispoke-linux-amd64\s*$' } |
            Select-Object -First 1) -replace '\s+unispoke-linux-amd64\s*$', ''
          if ([string]::IsNullOrWhiteSpace($expected)) {
            throw "SHA256SUMS does not contain unispoke-linux-amd64."
          }

          $actual = (Get-FileHash -LiteralPath $binaryPath -Algorithm SHA256).Hash
          if ($actual -ne $expected.Trim().ToUpperInvariant()) {
            throw "unispoke checksum mismatch."
          }

          $destination = Join-Path $vpnDir "unispoke"
          Move-Item -LiteralPath $binaryPath -Destination $destination -Force
          & chmod +x $destination
          Remove-Item -LiteralPath $sumsPath -Force -ErrorAction SilentlyContinue
          Write-Host "unispoke $version downloaded and verified."

      - name: Restore encrypted mirror cache
        uses: actions/cache/restore@v6
        with:
          path: .gitlab-mirror-cache.7z
          key: gitlab-mirror-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gitlab-mirror-cache-

      - name: Check mirror cache
        id: mirror-cache
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE ".gitlab-mirror-cache.7z"
          $valid = $false
          if (Test-Path -LiteralPath $path) {
            $item = Get-Item -LiteralPath $path -ErrorAction SilentlyContinue
            if ($null -ne $item -and $item.Length -ge 2GB) {
              $valid = $true
            }
          }
          if ($valid) {
            "need_legacy=false" >> $env:GITHUB_OUTPUT
            Write-Host "A complete mirror cache is already present."
          } else {
            Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
            "need_legacy=true" >> $env:GITHUB_OUTPUT
            Write-Host "Mirror cache is missing or incomplete; the legacy artifact will be used."
          }

      - name: Download legacy mirror cache artifact
        if: steps.mirror-cache.outputs.need_legacy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mirror-cache
          path: ${{ github.workspace }}

      - name: Extract mirror cache
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_ARCHIVE_PASSWORD)) {
            throw "SYNC_ARCHIVE_PASSWORD is empty or missing."
          }

          $archive = Join-Path $env:GITHUB_WORKSPACE ".gitlab-mirror-cache.7z"
          $cacheDir = Join-Path $env:GITHUB_WORKSPACE ".gitlab-mirror-cache"

          if (-not (Test-Path -LiteralPath $archive)) {
            Write-Host "No encrypted mirror cache was restored."
            return
          }

          Remove-Item -LiteralPath $cacheDir -Recurse -Force -ErrorAction SilentlyContinue
          7z x $archive "-o$env:GITHUB_WORKSPACE" "-p$env:SYNC_ARCHIVE_PASSWORD" -y

          if (-not (Test-Path -LiteralPath $cacheDir)) {
            throw "Encrypted mirror cache did not contain .gitlab-mirror-cache."
          }

          # The cache may have been created on another OS. No sync process is
          # running yet, so every lock file in the restored cache is stale.
          Get-ChildItem -Path $cacheDir -Recurse -Filter "*.lock" -File -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Start VPN
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SYNC_VPN_PROFILES_JSON:-}" ]; then
            echo "SYNC_VPN_PROFILES_JSON is empty or missing." >&2
            exit 1
          fi
          if [ -z "${SYNC_GITLAB_HOST:-}" ]; then
            echo "SYNC_GITLAB_HOST is empty or missing." >&2
            exit 1
          fi

          profile_value() {
            python3 - "$1" <<'PY'
          import json, os, sys
          data = json.loads(os.environ["SYNC_VPN_PROFILES_JSON"])
          if isinstance(data, str):
              data = json.loads(data)
          if isinstance(data, list):
              data = data[0]
          aliases = {
              "server": ["server", "Server"],
              "port": ["port", "Port"],
              "username": ["username", "Username"],
              "password": ["password", "Password"],
              "adapter_mtu": ["adapter_mtu", "AdapterMtu"],
          }
          for name in aliases.get(sys.argv[1], [sys.argv[1]]):
              if name in data and data[name] not in (None, ""):
                  print(data[name])
                  break
          PY
          }

          server="$(profile_value server)"
          port="$(profile_value port)"
          user="$(profile_value username)"
          password="$(profile_value password)"
          adapter_mtu="$(profile_value adapter_mtu)"

          if [ -z "$server" ] || [ -z "$port" ]; then
            echo "SYNC_SECRETS.vpn_profiles_json does not contain a usable profile (server/port)." >&2
            exit 1
          fi
          if [ -z "$user" ] || [ -z "$password" ]; then
            echo "SYNC_SECRETS.vpn_profiles_json profile is missing username/password." >&2
            exit 1
          fi

          gateway="${server}:${port}"

          echo "::add-mask::${gateway}"
          echo "::add-mask::${user}"
          echo "::add-mask::${password}"
          if [ -n "${SYNC_VPN_DOMAIN:-}" ]; then echo "::add-mask::${SYNC_VPN_DOMAIN}"; fi
          if [ -n "${SYNC_VPN_SNI:-}" ]; then echo "::add-mask::${SYNC_VPN_SNI}"; fi

          vpn_dir="$GITHUB_WORKSPACE/vpn"
          exe="$vpn_dir/unispoke"
          if [ ! -x "$exe" ]; then
            echo "Missing executable: $exe" >&2
            exit 1
          fi

          ca_path="$vpn_dir/ca.pem"
          rm -f "$ca_path"
          if [ -n "${SYNC_VPN_CA_PEM:-}" ]; then
            printf '%s\n' "$SYNC_VPN_CA_PEM" > "$ca_path"
          fi

          mss=0
          if [ -n "${SYNC_VPN_MSS:-}" ]; then
            mss="$SYNC_VPN_MSS"
          elif [ -n "$adapter_mtu" ] && [ "$adapter_mtu" -gt 40 ]; then
            mss=$((adapter_mtu - 40))
          fi

          args=(-gateway "$gateway" -user "$user" -vpn -vpn-name unispoke -log-level info -timeout 30s)
          if [ -f "$ca_path" ]; then
            args+=(-ca "$ca_path")
          else
            args+=(-insecure)
            echo "WARNING: unispoke TLS certificate verification is disabled for this connection."
          fi
          if [ -n "${SYNC_VPN_MODE:-}" ]; then args+=(-mode "$SYNC_VPN_MODE"); fi
          if [ -n "${SYNC_VPN_DOMAIN:-}" ]; then args+=(-domain "$SYNC_VPN_DOMAIN"); fi
          if [ -n "${SYNC_VPN_SNI:-}" ]; then args+=(-sni "$SYNC_VPN_SNI"); fi
          if [ "$mss" -gt 0 ]; then args+=(-mss "$mss"); fi

          stdout_log="$RUNNER_TEMP/unispoke.out.log"
          stderr_log="$RUNNER_TEMP/unispoke.err.log"
          connected=0

          for attempt in 1 2 3; do
            rm -f "$stdout_log" "$stderr_log"
            export UNISPOKE_PASSWORD="$password"

            sudo -n --preserve-env=UNISPOKE_PASSWORD "$exe" "${args[@]}" \
              >"$stdout_log" 2>"$stderr_log" &
            vpn_pid=$!
            echo "unispoke started (attempt $attempt)."
            route_added=0

            for _ in $(seq 1 60); do
              if ! kill -0 "$vpn_pid" 2>/dev/null; then
                break
              fi

              # Route only the GitLab host through the tunnel. This also covers
              # gateways whose split-route list does not include the GitLab subnet.
              if [ "$route_added" -eq 0 ] && ip link show unispoke >/dev/null 2>&1; then
                if sudo -n ip route replace "${SYNC_GITLAB_HOST}/32" dev unispoke 2>/dev/null; then
                  route_added=1
                fi
              fi

              if timeout 2 bash -c "</dev/tcp/${SYNC_GITLAB_HOST}/22" 2>/dev/null; then
                connected=1
                break
              fi
              sleep 2
            done

            if [ "$connected" -eq 1 ]; then
              break
            fi

            if ! ip link show unispoke >/dev/null 2>&1; then
              echo "Attempt $attempt: unispoke interface was not created."
            elif ip -4 route get "$SYNC_GITLAB_HOST" 2>/dev/null | grep -q "dev unispoke"; then
              echo "Attempt $attempt: interface is up and GitLab is routed through it, but port 22 is unreachable."
            else
              echo "Attempt $attempt: interface is up, but GitLab is not routed through it."
            fi

            if [ -f "$stderr_log" ]; then
              tail -n 8 "$stderr_log" | while IFS= read -r line; do
                for value in "$gateway" "$user" "$password" "${SYNC_VPN_DOMAIN:-}" "${SYNC_VPN_SNI:-}"; do
                  if [ -n "$value" ]; then line="${line//$value/***}"; fi
                done
                line="$(printf '%s\n' "$line" | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g; s/(uid=)0x[0-9a-fA-F]+/\1<id>/g')"
                echo "  $line"
              done
            fi

            sudo -n pkill -f "$exe" 2>/dev/null || true
            sleep 10
          done

          unset UNISPOKE_PASSWORD

          if [ "$connected" -ne 1 ]; then
            echo "VPN did not become ready after 3 attempts." >&2
            exit 1
          fi

          echo "VPN connected."
          echo "GitLab SSH port is reachable."

      - name: Verify GitHub stays off VPN
        shell: bash
        run: |
          set -euo pipefail

          adapter="unispoke"
          if ! ip link show "$adapter" >/dev/null 2>&1; then
            echo "unispoke network adapter was not found." >&2
            exit 1
          fi

          if ip -o -4 route show dev "$adapter" | grep -Eq '^(default|0\.0\.0\.0/[1-7])([[:space:]]|$)'; then
            echo "VPN installed a default or overly broad route; GitHub traffic would be tunnelled." >&2
            exit 1
          fi

          for host in github.com api.github.com; do
            mapfile -t addresses < <(getent ahostsv4 "$host" | awk '{print $1}' | sort -u)
            if [ "${#addresses[@]}" -eq 0 ]; then
              echo "Could not resolve $host; skipping its route check."
              continue
            fi

            for address in "${addresses[@]}"; do
              if ip -4 route get "$address" | grep -q "dev $adapter"; then
                echo "GitHub traffic ($host) is routed through the VPN adapter." >&2
                exit 1
              fi
            done
          done

          echo "GitHub traffic is not routed through the VPN."

      - name: Configure SSH
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_GITLAB_SSH_PRIVATE_KEY)) {
            throw "SYNC_GITLAB_SSH_PRIVATE_KEY is empty or missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:SYNC_GITLAB_HOST)) {
            throw "SYNC_GITLAB_HOST is empty or missing."
          }

          $sshDir = Join-Path $HOME ".ssh"
          $keyPath = Join-Path $sshDir "id_ed25519"
          $configPath = Join-Path $sshDir "config"
          $knownHostsPath = Join-Path $sshDir "known_hosts"

          New-Item -ItemType Directory -Path $sshDir -Force | Out-Null

          $privateKey = $env:SYNC_GITLAB_SSH_PRIVATE_KEY -replace "\\n", "`n"
          [System.IO.File]::WriteAllText(
            $keyPath,
            $privateKey.Trim() + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )

          & chmod 700 $sshDir
          & chmod 600 $keyPath

          $sshConfig = @"
          Host $($env:SYNC_GITLAB_HOST)
            HostName $($env:SYNC_GITLAB_HOST)
            User git
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          "@

          [System.IO.File]::WriteAllText(
            $configPath,
            $sshConfig.Trim() + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )

          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              $hostKeys = & ssh-keyscan -H $env:SYNC_GITLAB_HOST 2>$null
              if ($hostKeys) {
                $hostKeys | Out-File -FilePath $knownHostsPath -Encoding utf8 -Append
              }
            } catch {
              Write-Host "ssh-keyscan did not return host keys on attempt $attempt; continuing with accept-new."
            }

            if ((Test-Path -LiteralPath $knownHostsPath) -and (Get-Item -LiteralPath $knownHostsPath).Length -gt 0) {
              break
            }
            Start-Sleep -Seconds 5
          }

          try {
            $null = ssh -o BatchMode=yes -o ConnectTimeout=10 -T "git@$env:SYNC_GITLAB_HOST" 2>&1
            $sshExitCode = $LASTEXITCODE
          } catch {
            $sshExitCode = if ($null -ne $LASTEXITCODE) { $LASTEXITCODE } else { 255 }
          }

          if ($sshExitCode -notin 0, 1) {
            throw "GitLab SSH authentication test failed."
          }

          Write-Host "GitLab SSH authentication test completed."

      - name: Write sync config
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_CONFIG_JSON)) {
            throw "SYNC_CONFIG_JSON is empty or missing."
          }

          $configPath = Join-Path $env:GITHUB_WORKSPACE "config.json"
          [System.IO.File]::WriteAllText(
            $configPath,
            $env:SYNC_CONFIG_JSON,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Sync repositories
        shell: pwsh
        run: |
          $script = Join-Path (Join-Path $env:GITHUB_WORKSPACE "tools") "sync-gitlab-to-github.ps1"
          $configPath = Join-Path $env:GITHUB_WORKSPACE "config.json"
          if (-not (Test-Path -LiteralPath $script)) {
            throw "Missing sync script: $script"
          }

          & $script -ConfigPath $configPath -QuietOutput

      - name: Stop VPN
        if: always()
        shell: bash
        run: |
          if [ -n "${SYNC_GITLAB_HOST:-}" ]; then
            sudo -n ip route del "${SYNC_GITLAB_HOST}/32" dev unispoke 2>/dev/null || true
          fi
          sudo -n pkill -f "$GITHUB_WORKSPACE/vpn/unispoke" 2>/dev/null || true
          echo "unispoke stopped."

      - name: Remove sensitive files
        if: always()
        shell: pwsh
        run: |
          $paths = @(
            (Join-Path $env:GITHUB_WORKSPACE "config.json"),
            (Join-Path (Join-Path $env:GITHUB_WORKSPACE "vpn") "ca.pem"),
            (Join-Path $env:RUNNER_TEMP "unispoke.out.log"),
            (Join-Path $env:RUNNER_TEMP "unispoke.err.log")
          )
          foreach ($path in $paths) {
            Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
          }

      - name: Pack encrypted mirror cache
        if: always()
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_ARCHIVE_PASSWORD)) {
            throw "SYNC_ARCHIVE_PASSWORD is empty or missing."
          }

          $cacheDir = Join-Path $env:GITHUB_WORKSPACE ".gitlab-mirror-cache"
          $archive = Join-Path $env:GITHUB_WORKSPACE ".gitlab-mirror-cache.7z"

          if (-not (Test-Path -LiteralPath $cacheDir)) {
            Write-Host "No mirror cache directory was created."
            return
          }

          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          Push-Location $env:GITHUB_WORKSPACE
          try {
            7z a $archive ".gitlab-mirror-cache" "-p$env:SYNC_ARCHIVE_PASSWORD" -mhe=on -mx=3
          } finally {
            Pop-Location
          }

      - name: Save encrypted mirror cache
        if: always() && hashFiles('.gitlab-mirror-cache.7z') != ''
        uses: actions/cache/save@v6
        with:
          path: .gitlab-mirror-cache.7z
          key: gitlab-mirror-cache-${{ github.run_id }}-${{ github.run_attempt }}
