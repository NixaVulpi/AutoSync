name: Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 5"

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout sync tools
        uses: actions/checkout@v7
        with:
          repository: NixaVulpi/GitLab2GitHubSyncTools
          path: tools

      - name: Load sync secrets
        shell: pwsh
        env:
          SYNC_SECRETS_JSON: ${{ secrets.SYNC_SECRETS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_SECRETS_JSON)) {
            throw "Secret SYNC_SECRETS is empty or missing."
          }

          try {
            $secrets = $env:SYNC_SECRETS_JSON | ConvertFrom-Json
          } catch {
            throw "Secret SYNC_SECRETS is not valid JSON."
          }

          function Add-GlobalEnv {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Name,

              [AllowNull()]
              $Value,

              [switch]$Optional,

              [switch]$NoMask
            )

            if ($null -eq $Value) {
              if ($Optional) { return }
              throw "SYNC_SECRETS is missing required value: $Name"
            }

            if ($Value -is [string]) {
              $text = $Value
            } else {
              $text = ConvertTo-Json -InputObject $Value -Depth 100 -Compress
            }

            if ([string]::IsNullOrWhiteSpace($text)) {
              if ($Optional) { return }
              throw "SYNC_SECRETS is missing required value: $Name"
            }

            if (-not $NoMask) {
              foreach ($line in ($text -split "(`r`n|`n|`r)")) {
                if (-not [string]::IsNullOrWhiteSpace($line)) {
                  Write-Output "::add-mask::$line"
                }
              }
            }

            $delimiter = "EOF_$([Guid]::NewGuid().ToString('N'))"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$Name<<$delimiter"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value $text
            Add-Content -LiteralPath $env:GITHUB_ENV -Value $delimiter
          }

          Add-GlobalEnv -Name "SYNC_ARCHIVE_PASSWORD" -Value $secrets.archive_password
          Add-GlobalEnv -Name "SYNC_VPN_PROFILES_JSON" -Value $secrets.vpn_profiles_json
          Add-GlobalEnv -Name "SYNC_GITLAB_HOST" -Value $secrets.gitlab_host
          Add-GlobalEnv -Name "SYNC_GITLAB_SSH_PRIVATE_KEY" -Value $secrets.gitlab_ssh_private_key
          Add-GlobalEnv -Name "SYNC_CONFIG_JSON" -Value $secrets.sync_config

          # Optional unispoke settings. These are not secrets, so they are not masked.
          $syncConfig = $secrets.sync_config
          if ($syncConfig -is [string]) {
            $syncConfig = $syncConfig | ConvertFrom-Json
          }
          foreach ($tokenName in @("github_token", "gitlab_token")) {
            $tokenValue = $syncConfig.$tokenName
            if (-not [string]::IsNullOrWhiteSpace($tokenValue)) {
              Write-Output "::add-mask::$tokenValue"
            }
          }

          $unispokeVersion = if ([string]::IsNullOrWhiteSpace([string]$secrets.unispoke_version)) {
            "v0.1.0"
          } else {
            [string]$secrets.unispoke_version
          }

          Add-GlobalEnv -Name "SYNC_UNISPOKE_VERSION" -Value $unispokeVersion -NoMask
          Add-GlobalEnv -Name "SYNC_VPN_CA_PEM" -Value $secrets.vpn_ca_pem -Optional -NoMask
          Add-GlobalEnv -Name "SYNC_VPN_DOMAIN" -Value $secrets.vpn_domain -Optional -NoMask
          Add-GlobalEnv -Name "SYNC_VPN_SNI" -Value $secrets.vpn_sni -Optional -NoMask
          Add-GlobalEnv -Name "SYNC_VPN_MODE" -Value $secrets.vpn_mode -Optional -NoMask
          Add-GlobalEnv -Name "SYNC_VPN_MSS" -Value $secrets.vpn_mss -Optional -NoMask

      - name: Check runner privileges
        shell: pwsh
        run: |
          $current = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($current)
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)

          if (-not $isAdmin) {
            throw "Runner is not running as administrator."
          }

          Write-Host "Runner is running as administrator."

      - name: Download VPN support files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download bin `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "bin.7z" `
            --dir $env:GITHUB_WORKSPACE `
            --clobber

      - name: Extract VPN support files
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_ARCHIVE_PASSWORD)) {
            throw "SYNC_ARCHIVE_PASSWORD is empty or missing."
          }

          $archive = Join-Path $env:GITHUB_WORKSPACE "bin.7z"
          $vpnDir = Join-Path $env:GITHUB_WORKSPACE "vpn"

          if (-not (Test-Path -LiteralPath $archive)) {
            throw "Missing archive: $archive"
          }

          New-Item -ItemType Directory -Path $vpnDir -Force | Out-Null
          7z x $archive "-o$vpnDir" "-p$env:SYNC_ARCHIVE_PASSWORD" -y

          $wintun = Get-ChildItem -Path $vpnDir -Recurse -Filter "wintun.dll" -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $wintun) {
            throw "Missing wintun.dll after extraction."
          }
          if ($wintun.DirectoryName -ne $vpnDir) {
            Copy-Item -LiteralPath $wintun.FullName -Destination (Join-Path $vpnDir "wintun.dll") -Force
          }

      - name: Download unispoke
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_UNISPOKE_VERSION)) {
            throw "SYNC_UNISPOKE_VERSION is empty or missing."
          }

          $vpnDir = Join-Path $env:GITHUB_WORKSPACE "vpn"
          New-Item -ItemType Directory -Path $vpnDir -Force | Out-Null

          gh release download $env:SYNC_UNISPOKE_VERSION `
            --repo NixaVulpi/unispoke `
            --pattern "unispoke-windows-amd64.exe" `
            --pattern "SHA256SUMS" `
            --dir $vpnDir `
            --clobber

          $sumsPath = Join-Path $vpnDir "SHA256SUMS"
          $binaryPath = Join-Path $vpnDir "unispoke-windows-amd64.exe"
          if (-not (Test-Path -LiteralPath $binaryPath) -or -not (Test-Path -LiteralPath $sumsPath)) {
            throw "unispoke release download is incomplete."
          }

          $expected = (Get-Content -LiteralPath $sumsPath |
            Where-Object { $_ -match '\s+unispoke-windows-amd64\.exe\s*$' } |
            Select-Object -First 1) -replace '\s+unispoke-windows-amd64\.exe\s*$', ''
          if ([string]::IsNullOrWhiteSpace($expected)) {
            throw "SHA256SUMS does not contain unispoke-windows-amd64.exe."
          }

          $actual = (Get-FileHash -LiteralPath $binaryPath -Algorithm SHA256).Hash
          if ($actual -ne $expected.Trim().ToUpperInvariant()) {
            throw "unispoke checksum mismatch."
          }

          Move-Item -LiteralPath $binaryPath -Destination (Join-Path $vpnDir "unispoke.exe") -Force
          Remove-Item -LiteralPath $sumsPath -Force -ErrorAction SilentlyContinue
          Write-Host "unispoke $env:SYNC_UNISPOKE_VERSION downloaded and verified."

      - name: Restore encrypted mirror cache
        uses: actions/cache/restore@v6
        with:
          path: .gitlab-mirror-cache.7z
          key: gitlab-mirror-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gitlab-mirror-cache-${{ runner.os }}-

      - name: Extract mirror cache
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_ARCHIVE_PASSWORD)) {
            throw "SYNC_ARCHIVE_PASSWORD is empty or missing."
          }

          $archive = Join-Path $env:GITHUB_WORKSPACE ".gitlab-mirror-cache.7z"
          $cacheDir = Join-Path $env:GITHUB_WORKSPACE ".gitlab-mirror-cache"

          if (-not (Test-Path -LiteralPath $archive)) {
            Write-Host "No encrypted mirror cache was restored."
            return
          }

          Remove-Item -LiteralPath $cacheDir -Recurse -Force -ErrorAction SilentlyContinue
          7z x $archive "-o$env:GITHUB_WORKSPACE" "-p$env:SYNC_ARCHIVE_PASSWORD" -y

          if (-not (Test-Path -LiteralPath $cacheDir)) {
            throw "Encrypted mirror cache did not contain .gitlab-mirror-cache."
          }

      - name: Start VPN
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_VPN_PROFILES_JSON)) {
            throw "SYNC_VPN_PROFILES_JSON is empty or missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:SYNC_GITLAB_HOST)) {
            throw "SYNC_GITLAB_HOST is empty or missing."
          }

          $profiles = $env:SYNC_VPN_PROFILES_JSON | ConvertFrom-Json
          if ($profiles -is [string]) {
            $profiles = $profiles | ConvertFrom-Json
          }
          $profile = @($profiles) | Select-Object -First 1

          function Get-ProfileValue {
            param($Object, [string[]]$Names)
            foreach ($name in $Names) {
              $property = $Object.PSObject.Properties | Where-Object { $_.Name -ieq $name } | Select-Object -First 1
              if ($null -ne $property) { return $property.Value }
            }
            return $null
          }

          $server = [string](Get-ProfileValue $profile @("server", "Server"))
          $port = Get-ProfileValue $profile @("port", "Port")
          $user = [string](Get-ProfileValue $profile @("username", "Username"))
          $password = [string](Get-ProfileValue $profile @("password", "Password"))
          $adapterMtu = Get-ProfileValue $profile @("adapter_mtu", "AdapterMtu")

          if ([string]::IsNullOrWhiteSpace($server) -or $null -eq $port) {
            throw "SYNC_SECRETS.vpn_profiles_json does not contain a usable profile (server/port)."
          }
          if ([string]::IsNullOrWhiteSpace($user) -or [string]::IsNullOrWhiteSpace($password)) {
            throw "SYNC_SECRETS.vpn_profiles_json profile is missing username/password."
          }

          $gateway = "${server}:${port}"

          # Mask every derived value before it can reach the log.
          foreach ($value in @($gateway, $user, $password)) {
            Write-Output "::add-mask::$value"
          }
          foreach ($value in @($env:SYNC_VPN_DOMAIN, $env:SYNC_VPN_SNI)) {
            if (-not [string]::IsNullOrWhiteSpace($value)) {
              Write-Output "::add-mask::$value"
            }
          }

          $vpnDir = Join-Path $env:GITHUB_WORKSPACE "vpn"
          $exe = Join-Path $vpnDir "unispoke.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Missing executable: $exe"
          }

          $caPath = Join-Path $vpnDir "ca.pem"
          Remove-Item -LiteralPath $caPath -Force -ErrorAction SilentlyContinue
          if (-not [string]::IsNullOrWhiteSpace($env:SYNC_VPN_CA_PEM)) {
            [System.IO.File]::WriteAllText(
              $caPath,
              $env:SYNC_VPN_CA_PEM,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          $mss = 0
          if (-not [string]::IsNullOrWhiteSpace($env:SYNC_VPN_MSS)) {
            $mss = [int]$env:SYNC_VPN_MSS
          } elseif ($null -ne $adapterMtu -and [int]$adapterMtu -gt 40) {
            $mss = [int]$adapterMtu - 40
          }

          function ConvertTo-ArgToken {
            param([string]$Value)
            if ($Value -match '[\s"]') {
              return '"' + ($Value -replace '"', '\"') + '"'
            }
            return $Value
          }

          $arguments = @(
            '-gateway', $gateway,
            '-user', $user,
            '-vpn',
            '-vpn-name', 'unispoke',
            '-log-level', 'warn',
            '-timeout', '30s'
          )
          if (Test-Path -LiteralPath $caPath) {
            $arguments += @('-ca', $caPath)
          } else {
            $arguments += '-insecure'
            Write-Host "WARNING: unispoke TLS certificate verification is disabled for this connection."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SYNC_VPN_MODE)) { $arguments += @('-mode', $env:SYNC_VPN_MODE) }
          if (-not [string]::IsNullOrWhiteSpace($env:SYNC_VPN_DOMAIN)) { $arguments += @('-domain', $env:SYNC_VPN_DOMAIN) }
          if (-not [string]::IsNullOrWhiteSpace($env:SYNC_VPN_SNI)) { $arguments += @('-sni', $env:SYNC_VPN_SNI) }
          if ($mss -gt 0) { $arguments += @('-mss', "$mss") }
          $argumentLine = ($arguments | ForEach-Object { ConvertTo-ArgToken $_ }) -join ' '

          $stdoutPath = Join-Path $env:RUNNER_TEMP "unispoke.out.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "unispoke.err.log"
          $connected = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Remove-Item -LiteralPath $stdoutPath, $stderrPath -Force -ErrorAction SilentlyContinue
            $env:UNISPOKE_PASSWORD = $password

            $vpnProcess = Start-Process `
              -FilePath $exe `
              -ArgumentList $argumentLine `
              -WorkingDirectory $vpnDir `
              -WindowStyle Hidden `
              -PassThru `
              -RedirectStandardOutput $stdoutPath `
              -RedirectStandardError $stderrPath

            Write-Host "unispoke started (attempt $attempt)."

            for ($wait = 1; $wait -le 60; $wait++) {
              if ($vpnProcess.HasExited) { break }
              if (Test-NetConnection -ComputerName $env:SYNC_GITLAB_HOST -Port 22 -InformationLevel Quiet) {
                $connected = $true
                break
              }
              Start-Sleep -Seconds 2
            }

            if ($connected) { break }
            if (-not $vpnProcess.HasExited) {
              Stop-Process -Id $vpnProcess.Id -Force -ErrorAction SilentlyContinue
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }

          Remove-Item Env:\UNISPOKE_PASSWORD -ErrorAction SilentlyContinue

          if (-not $connected) {
            $maskValues = @($gateway, $user, $password, $env:SYNC_VPN_DOMAIN, $env:SYNC_VPN_SNI) |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            if (Test-Path -LiteralPath $stderrPath) {
              Get-Content -LiteralPath $stderrPath -Tail 12 | ForEach-Object {
                $line = $_
                foreach ($value in $maskValues) {
                  $line = $line.Replace($value, '***')
                }
                $line = $line -replace '\b(?:\d{1,3}\.){3}\d{1,3}\b', '<ip>'
                $line = $line -replace '(uid=)0x[0-9a-fA-F]+', '${1}<id>'
                Write-Host $line
              }
            }
            throw "VPN did not become ready after 3 attempts."
          }

          Write-Host "VPN connected."
          Write-Host "GitLab SSH port is reachable."

      - name: Configure SSH
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_GITLAB_SSH_PRIVATE_KEY)) {
            throw "SYNC_GITLAB_SSH_PRIVATE_KEY is empty or missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:SYNC_GITLAB_HOST)) {
            throw "SYNC_GITLAB_HOST is empty or missing."
          }

          $sshDir = Join-Path $HOME ".ssh"
          $keyPath = Join-Path $sshDir "id_ed25519"
          $configPath = Join-Path $sshDir "config"
          $knownHostsPath = Join-Path $sshDir "known_hosts"

          New-Item -ItemType Directory -Path $sshDir -Force | Out-Null

          $privateKey = $env:SYNC_GITLAB_SSH_PRIVATE_KEY -replace "\\n", "`n"
          [System.IO.File]::WriteAllText(
            $keyPath,
            $privateKey.Trim() + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )

          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null

          $sshConfig = @"
          Host $($env:SYNC_GITLAB_HOST)
            HostName $($env:SYNC_GITLAB_HOST)
            User git
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          "@

          [System.IO.File]::WriteAllText(
            $configPath,
            $sshConfig.Trim() + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )

          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              $hostKeys = & ssh-keyscan -H $env:SYNC_GITLAB_HOST 2>$null
              if ($hostKeys) {
                $hostKeys | Out-File -FilePath $knownHostsPath -Encoding utf8 -Append
              }
            } catch {
              Write-Host "ssh-keyscan did not return host keys on attempt $attempt; continuing with accept-new."
            }

            if ((Test-Path -LiteralPath $knownHostsPath) -and (Get-Item -LiteralPath $knownHostsPath).Length -gt 0) {
              break
            }
            Start-Sleep -Seconds 5
          }

          try {
            $null = ssh -o BatchMode=yes -o ConnectTimeout=10 -T "git@$env:SYNC_GITLAB_HOST" 2>&1
            $sshExitCode = $LASTEXITCODE
          } catch {
            $sshExitCode = if ($null -ne $LASTEXITCODE) { $LASTEXITCODE } else { 255 }
          }

          if ($sshExitCode -notin 0, 1) {
            throw "GitLab SSH authentication test failed."
          }

          Write-Host "GitLab SSH authentication test completed."

      - name: Write sync config
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_CONFIG_JSON)) {
            throw "SYNC_CONFIG_JSON is empty or missing."
          }

          $configPath = Join-Path $env:GITHUB_WORKSPACE "config.json"
          [System.IO.File]::WriteAllText(
            $configPath,
            $env:SYNC_CONFIG_JSON,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Sync repositories
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "tools\sync-gitlab-to-github.ps1"
          $configPath = Join-Path $env:GITHUB_WORKSPACE "config.json"
          if (-not (Test-Path -LiteralPath $script)) {
            throw "Missing sync script: $script"
          }

          & $script -ConfigPath $configPath -QuietOutput

      - name: Stop VPN
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name "unispoke" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "unispoke stopped."

      - name: Remove sensitive files
        if: always()
        shell: pwsh
        run: |
          $paths = @(
            (Join-Path $env:GITHUB_WORKSPACE "config.json"),
            (Join-Path $env:GITHUB_WORKSPACE "vpn\ca.pem"),
            (Join-Path $env:RUNNER_TEMP "unispoke.out.log"),
            (Join-Path $env:RUNNER_TEMP "unispoke.err.log")
          )
          foreach ($path in $paths) {
            Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
          }

      - name: Pack encrypted mirror cache
        if: always()
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_ARCHIVE_PASSWORD)) {
            throw "SYNC_ARCHIVE_PASSWORD is empty or missing."
          }

          $cacheDir = Join-Path $env:GITHUB_WORKSPACE ".gitlab-mirror-cache"
          $archive = Join-Path $env:GITHUB_WORKSPACE ".gitlab-mirror-cache.7z"

          if (-not (Test-Path -LiteralPath $cacheDir)) {
            Write-Host "No mirror cache directory was created."
            return
          }

          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          Push-Location $env:GITHUB_WORKSPACE
          try {
            7z a $archive ".gitlab-mirror-cache" "-p$env:SYNC_ARCHIVE_PASSWORD" -mhe=on -mx=3
          } finally {
            Pop-Location
          }

      - name: Save encrypted mirror cache
        if: always() && hashFiles('.gitlab-mirror-cache.7z') != ''
        uses: actions/cache/save@v6
        with:
          path: .gitlab-mirror-cache.7z
          key: gitlab-mirror-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
